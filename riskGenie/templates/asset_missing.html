<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <title>資產缺漏檢查</title>


    <!-- 使用資產總表 CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/asset_summary.css') }}">

</head>


<body>


<div class="summary-card">


<h1 class="page-title">
    資產缺漏檢查
</h1>


<p>
    目前資產數量：{{ total }} 筆
</p>


<div class="table-container">


<table class="asset-table" style="min-width:900px;">

<thead>

<tr>

<th>資產代碼</th>

<th>資產名稱</th>

<th>缺漏項目</th>

<th>操作</th>

</tr>

</thead>


<tbody>

{% for item in missing_assets %}

<tr>

<td>
{{ item.asset.asset_id_code }}
</td>


<td>
{{ item.asset.asset_name }}
</td>


<td style="text-align:left;">

{% for error in item.errors %}

<div>
❌ {{ error }}
</div>

{% endfor %}

</td>


<td>

<a href="{{ url_for('asset_edit', id=item.asset.id) }}"
class="operation-btn edit-btn">

補充資料

</a>

</td>


</tr>


{% endfor %}

</tbody>


</table>


</div>


</div>


</body>

</html>
