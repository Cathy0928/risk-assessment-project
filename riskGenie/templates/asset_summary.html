<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Genie 資安管理系統 - 資產總表</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/asset_summary.css') }}">
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-title">👤 Genie</div>
        <a href="/"><button class="menu-btn">首  頁</button></a>
        <a href="/summary"><button class="menu-btn active">資產總表</button></a>
        <button class="menu-btn">風險評鑑</button>
        <button class="menu-btn">權重設定</button>
        <button class="menu-btn">ＡＩ建議</button>
        <button class="menu-btn">建議報表</button>
        <button class="menu-btn">帳號管理</button>
        <div class="menu-footer"><button class="menu-btn">⚙️ 設定</button></div>
    </div>

    <div class="main-content">
        <div class="content-wrapper">
            <h1 class="page-title">資產總表</h1>
            <table class="asset-table">
                <thead>
                    <tr>
                        <th>編號</th><th>類別</th><th>名稱</th><th>負責單位</th><th>保管單位</th>
                        <th style="border: none; background: none; width: 50px;"></th>
                    </tr>
                </thead>
                <tbody>
                    {% for row in assets %}
                    <tr>
                        <td>{{ row.編號 }}</td>
                        <td>{{ row.類別 }}</td>
                        <td>{{ row.名稱 }}</td>
                        <td>{{ row.負責單位 }}</td>
                        <td>{{ row.保管單位 }}</td>
                        <td class="edit-cell">✏️</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
            <div class="bottom-action"><button class="check-btn">檢視資產盤點表缺漏</button></div>
        </div>
    </div>

</body>
</html>
