<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RiskGenie｜首頁{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    {% block page_styles %}{% endblock %}
</head>

<body class="rg-app">

<div class="sidebar">

    <div class="sidebar-title">
        {% block sidebar_title %}RiskGenie{% endblock %}
    </div>

    <a href="{{ url_for('home') }}">
        <button class="menu-btn{% if active_page == 'home' %} active{% endif %}">首 頁</button>
    </a>

    <div class="sidebar-section-label">
        <small>資產管理</small>
    </div>

    <a href="{{ url_for('asset_summary') }}">
        <button class="menu-btn{% if active_page == 'asset_summary' %} active{% endif %}">資產總表</button>
    </a>

    <div class="sidebar-section-label">
        <small>風險管理</small>
    </div>

    <a href="{{ url_for('risk.risk_assessment_page') }}">
        <button class="menu-btn{% if active_page == 'risk_assessment' %} active{% endif %}">風險評鑑</button>
    </a>

    <a href="{{ url_for('risk.ai_advice_page') }}">
        <button class="menu-btn{% if active_page == 'ai_advice' %} active{% endif %}">AI 建議</button>
    </a>

    <button class="menu-btn">風險報表</button>

    <div class="sidebar-section-label">
        <small>系統管理</small>
    </div>

    <a href="{{ url_for('risk.weight_setting_page') }}">
        <button class="menu-btn{% if active_page == 'weight_setting' %} active{% endif %}">權重設定</button>
    </a>

    <a href="{{ url_for('admin_users_page') }}">
        <button class="menu-btn{% if active_page == 'admin_users' %} active{% endif %}">帳號管理</button>
    </a>

    <div class="menu-footer">

        <div class="session-user">
            <strong>{{ session.get("username", "使用者") }}</strong><br>
            {{ session.get("role_name", "") }}
        </div>

        <form action="{{ url_for('logout') }}" method="post">
            <button class="menu-btn logout-btn" type="submit">
                登出
            </button>
        </form>

    </div>

</div>

<div class="main-content">
    {% block main_content %}{% endblock %}
</div>

{% block page_scripts %}{% endblock %}

</body>
</html>
