<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiskGenie</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-title">RiskGenie</div>
        <a href="/"><button class="menu-btn active">首頁</button></a>
        <a href="/summary"><button class="menu-btn">資產總覽</button></a>
        <a href="/assess"><button class="menu-btn">風險評鑑</button></a>
        <button class="menu-btn">控制項管理</button>
        <button class="menu-btn">改善建議</button>
        <button class="menu-btn">報表</button>
        <div class="menu-footer">
            <div class="session-user">
                <span>{{ session.get("username", "使用者") }}</span>
                <small>{{ session.get("role_name", "未設定角色") }}</small>
            </div>
            <form method="post" action="{{ url_for('logout') }}">
                <button class="menu-btn logout-btn" type="submit">登出</button>
            </form>
        </div>
    </aside>

    <main class="main-content">
        <div class="content-wrapper">
            <div class="upload-box">上傳資產資料表 (.xlsx)</div>
            <div class="action-bar"><button class="add-btn">+ 新增資產</button></div>
            <table class="asset-table-simple">
                <thead>
                    <tr>
                        <th>編號</th>
                        <th>資產名稱</th>
                        <th>擁有者</th>
                        <th>機密性</th>
                        <th>完整性</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>A</td>
                        <td>Team A</td>
                        <td>A</td>
                        <td>A</td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>B</td>
                        <td>Team B</td>
                        <td>B</td>
                        <td>B</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
