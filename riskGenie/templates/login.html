<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 · RiskGenie 評評理</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-panel" aria-labelledby="login-title">
            <div class="brand-mark">
                RiskGenie 評評理
                <small>資訊資產與風險治理工作台</small>
            </div>
            <h1 id="login-title">登入作業</h1>

            {% if error %}
            <div class="alert alert--danger" role="alert">{{ error }}</div>
            {% endif %}

            <form class="login-form" method="post" action="{{ url_for('login') }}">
                <div class="field">
                    <label class="label" for="email">電子郵件</label>
                    <input
                        class="input"
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        required
                        value="{{ request.form.get('email', '') }}"
                    >
                </div>

                <div class="field">
                    <label class="label" for="password">密碼</label>
                    <div class="password-row">
                        <input
                            class="input"
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            required
                        >
                        <button id="togglePassword" class="btn btn--ghost" type="button" aria-controls="password" aria-pressed="false">
                            顯示
                        </button>
                    </div>
                </div>

                <button class="btn btn--primary" type="submit" style="margin-top: var(--sp-2);">登入</button>
            </form>
        </section>
    </main>

    <script>
        const toggleButton = document.getElementById("togglePassword");
        const passwordInput = document.getElementById("password");

        toggleButton.addEventListener("click", () => {
            const isHidden = passwordInput.type === "password";
            passwordInput.type = isHidden ? "text" : "password";
            toggleButton.textContent = isHidden ? "隱藏" : "顯示";
            toggleButton.setAttribute("aria-pressed", String(isHidden));
        });
    </script>
</body>
</html>
