<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiskGenie - 風險評鑑 (開發測試介面)</title>
    <style>
        body { font-family: "Segoe UI", Arial, sans-serif; margin: 30px; background-color: #f8f9fa; }
        .container { max-width: 800px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { color: #333; border-bottom: 2px solid #007bff; padding-bottom: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        select, input, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-right: 10px; }
        .btn:hover { background-color: #0056b3; }
        .btn-success { background-color: #28a745; }
        .btn-success:hover { background-color: #218838; }
        .result-box { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 6px; }
        .badge { padding: 4px 8px; border-radius: 4px; color: white; font-weight: bold; }
        .bg-danger { background-color: #dc3545; }
        .bg-warning { background-color: #ffc107; color: black; }
        .bg-info { background-color: #17a2b8; }
        .bg-secondary { background-color: #6c757d; }
    </style>
</head>
<body>

<div class="container">
    <h2>🛡️ RiskGenie 風險評鑑 (暫時測試介面)</h2>
    <p>前端開發完成前，可使用此介面完整驗證「風險計算」與「資料寫入 Supabase」邏輯。</p>
    <hr>

    <form id="assessmentForm">
        <div class="form-group">
            <label for="assetSelect">1. 選擇評鑑資產：</label>
            <select id="assetSelect" required onchange="onAssetChanged()">
                <option value="">-- 請選擇資產 --</option>
            </select>
        </div>

        <div style="display: flex; gap: 10px;" class="form-group">
            <div style="flex: 1;">
                <label>機密性 (C):</label>
                <input type="number" id="confidentiality" min="1" max="5" value="3" required>
            </div>
            <div style="flex: 1;">
                <label>完整性 (I):</label>
                <input type="number" id="integrity" min="1" max="5" value="3" required>
            </div>
            <div style="flex: 1;">
                <label>可用性 (A):</label>
                <input type="number" id="availability" min="1" max="5" value="3" required>
            </div>
            <div style="flex: 1;">
                <label>適法性 (L):</label>
                <input type="number" id="legality" min="1" max="5" value="1" required>
            </div>
        </div>

        <div class="form-group">
            <label for="threatDescription">2. 威脅與弱點描述：</label>
            <textarea id="threatDescription" rows="2" placeholder="例：伺服器未更新防毒軟體，易受勒索病毒攻擊"></textarea>
        </div>

        <div style="display: flex; gap: 10px;" class="form-group">
            <div style="flex: 1;">
                <label for="cvssScore">CVSS 弱點嚴重度 (0-10):</label>
                <input type="number" id="cvssScore" step="0.1" min="0" max="10" value="7.5">
            </div>
            <div style="flex: 1;">
                <label for="likelihoodScore">發生機率 (Likelihood 1-5):</label>
                <input type="number" id="likelihoodScore" min="1" max="5" value="3">
            </div>
        </div>

        <button type="button" class="btn" onclick="calculateRisk()">1. 計算風險值</button>
        <button type="button" class="btn btn-success" onclick="saveAssessment()">2. 儲存評鑑結果</button>
    </form>

    <div class="result-box" id="resultBox" style="display: none;">
        <h3>📊 評鑑計算結果：</h3>
        <p><strong>資產價值/衝擊度 (Impact Score)：</strong> <span id="resImpact">-</span></p>
        <p><strong>風險分數 (Risk Score)：</strong> <span id="resScore">-</span></p>
        <p><strong>風險等級 (Risk Level)：</strong> <span id="resLevel" class="badge bg-secondary">-</span></p>
    </div>
</div>

<script>
    let currentAssets = [];

    // 初始化頁面：載入資產清單
    async function fetchAssets() {
        try {
            const res = await fetch('/api/risk-assessments/assets');
            const data = await res.json();
            if (data.success) {
                currentAssets = data.assets;
                const select = document.getElementById('assetSelect');
                select.innerHTML = '<option value="">-- 請選擇資產 --</option>';
                data.assets.forEach(asset => {
                    select.innerHTML += `<option value="${asset.id}">[${asset.asset_id_code}] ${asset.asset_name}</option>`;
                });
            }
        } catch (err) {
            alert('載入資產列表失敗！');
        }
    }

    // 選取資產時自動帶入 C, I, A, L
    function onAssetChanged() {
        const assetId = document.getElementById('assetSelect').value;
        const asset = currentAssets.find(a => a.id == assetId);
        if (asset) {
            document.getElementById('confidentiality').value = asset.confidentiality || 3;
            document.getElementById('integrity').value = asset.integrity || 3;
            document.getElementById('availability').value = asset.availability || 3;
            document.getElementById('legality').value = asset.legality || 1;
        }
    }

    // 發送 API 計算風險
    async function calculateRisk() {
        const payload = {
            confidentiality: document.getElementById('confidentiality').value,
            integrity: document.getElementById('integrity').value,
            availability: document.getElementById('availability').value,
            legality: document.getElementById('legality').value,
            cvss_score: document.getElementById('cvssScore').value,
            likelihood_score: document.getElementById('likelihoodScore').value
        };

        const res = await fetch('/api/risk-assessments/calculate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (data.success) {
            document.getElementById('resultBox').style.display = 'block';
            document.getElementById('resImpact').innerText = data.impact_score;
            document.getElementById('resScore').innerText = data.risk_score;
            
            const levelElem = document.getElementById('resLevel');
            levelElem.innerText = data.risk_level;
            levelElem.className = 'badge ' + (
                data.risk_level.includes('高') ? 'bg-danger' : 
                data.risk_level.includes('中') ? 'bg-warning' : 'bg-info'
            );
            return data;
        } else {
            alert('計算失敗: ' + data.error);
        }
    }

    // 儲存評鑑結果至 Supabase
    async function saveAssessment() {
        const assetId = document.getElementById('assetSelect').value;
        if (!assetId) {
            alert('請先選擇資產！');
            return;
        }

        const calcData = await calculateRisk();
        if (!calcData) return;

        const payload = {
            asset_id: parseInt(assetId),
            threat_description: document.getElementById('threatDescription').value,
            impact_score: calcData.impact_score,
            likelihood_score: parseFloat(document.getElementById('likelihoodScore').value),
            risk_score: calcData.risk_score,
            risk_level: calcData.risk_level
        };

        const res = await fetch('/api/risk-assessments/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (data.success) {
            alert('✅ 評鑑紀錄已成功寫入資料庫！');
        } else {
            alert('❌ 儲存失敗：' + data.error);
        }
    }

    fetchAssets();
</script>

</body>
</html>
