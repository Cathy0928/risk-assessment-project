<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>權重設定</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/weight_setting.css') }}">
</head>
<body>

<div class="sidebar">

    <div class="sidebar-title">
        RiskGenie
    </div>

    <a href="{{ url_for('home') }}">
        <button class="menu-btn">首 頁</button>
    </a>

    <a href="{{ url_for('asset_summary') }}">
        <button class="menu-btn">資產總表</button>
    </a>

    <button class="menu-btn">風險評鑑</button>
    <a href="{{ url_for('risk.weight_setting_page') }}">
        <button class="menu-btn active">權重設定</button>
    </a>
    <button class="menu-btn">AI建議</button>
    <button class="menu-btn">建議報表</button>
    <button class="menu-btn">帳號管理</button>

    <div class="menu-footer">

        <div class="session-user">
            <strong>{{ session.get("username","使用者") }}</strong><br>
            {{ session.get("role_name","") }}
        </div>

        <form action="{{ url_for('logout') }}" method="post">
            <button class="menu-btn logout-btn" type="submit">
                登出
            </button>
        </form>

    </div>

</div>

<div class="main-content">

    <div class="content-wrapper">

        <h1 class="page-title">權重設定</h1>

        <form id="weightForm" class="weight-form">

            <div class="method-group">
                
                <div class="method-row">
                    <button type="button" class="method-btn active" data-type="max">最大值</button>
                </div>

                <div class="method-row">
                    <button type="button" class="method-btn" data-type="sum">總合法</button>
                </div>

                <div class="method-row">
                    <button type="button" class="method-btn" data-type="avg">平均法</button>
                </div>

                <div class="method-row weighted-row">
                    <button type="button" class="method-btn" data-type="weighted_average">加權平均法</button>

                    <div class="inputs-inline" id="weightedInputs">
                        <label>C : <input type="number" step="0.01" min="0" max="100" id="weight_c" name="weight_c" class="underline-input" value="0.3333"></label>
                        <label>I : <input type="number" step="0.01" min="0" max="100" id="weight_i" name="weight_i" class="underline-input" value="0.3333"></label>
                        <label>A : <input type="number" step="0.01" min="0" max="100" id="weight_a" name="weight_a" class="underline-input" value="0.3333"></label>
                    </div>
                </div>

            </div>

            <div class="save-action">
                <button type="submit" class="save-btn">儲存</button>
            </div>

        </form>

    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    let currentFormula = "max";
    const buttons = document.querySelectorAll(".method-btn");
    const weightedInputs = document.getElementById("weightedInputs");
    const inputC = document.getElementById("weight_c");
    const inputI = document.getElementById("weight_i");
    const inputA = document.getElementById("weight_a");

    // 1. 進入頁面時呼叫 API 載入當前設定
    fetch("/api/weight-settings")
        .then(res => res.json())
        .then(data => {
            if (data && data.formula_type) {
                currentFormula = data.formula_type;
                setActiveButton(currentFormula);
                
                if (data.weight_c !== undefined) inputC.value = data.weight_c;
                if (data.weight_i !== undefined) inputI.value = data.weight_i;
                if (data.weight_a !== undefined) inputA.value = data.weight_a;
            }
        })
        .catch(err => console.error("讀取權重設定失敗:", err));

    // 2. 切換公式按鈕效果與狀態紀錄
    buttons.forEach(btn => {
        btn.addEventListener("click", function () {
            currentFormula = this.getAttribute("data-type");
            setActiveButton(currentFormula);
        });
    });

    function setActiveButton(formulaType) {
        buttons.forEach(b => {
            if (b.getAttribute("data-type") === formulaType) {
                b.classList.add("active");
            } else {
                b.classList.remove("active");
            }
        });

        // 保持所有輸入框皆可修改與編輯
        weightedInputs.style.opacity = "1";
        inputC.disabled = false;
        inputI.disabled = false;
        inputA.disabled = false;
    }

    // 3. 表單 Ajax 提交
    document.getElementById("weightForm").addEventListener("submit", function (e) {
        e.preventDefault();

        const payload = {
            formula_type: currentFormula,
            weight_c: parseFloat(inputC.value) || 0.3333,
            weight_i: parseFloat(inputI.value) || 0.3333,
            weight_a: parseFloat(inputA.value) || 0.3333
        };

        fetch("/api/weight-settings", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        })
        .then(res => res.json().then(data => ({ status: res.status, body: data })))
        .then(res => {
            if (res.status === 200) {
                if (res.body.status === "local_backup_only" || res.body.supabase_synced === false) {
                    alert("⚠️ " + (res.body.message || "已儲存至本機備份，但雲端同步失敗。"));
                } else {
                    alert("✅ " + (res.body.message || "權重與公式設定儲存成功！"));
                }
            } else {
                alert("❌ 儲存失敗: " + (res.body.error || "未知錯誤"));
            }
        })
        .catch(err => alert("發送請求失敗: " + err));
    });
});
</script>

</body>
</html>
